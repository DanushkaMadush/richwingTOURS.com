<footer class="footer">
  <div class="footer__main">
    <div class="container footer__grid">
      <section class="footer__brand">
        <h2>richwing<span>TOURS</span></h2>
        <p>Create Timeless Memories in Nature's Embrace</p>

        <h3>Follow Us On</h3>
        <app-social-links [links]="socialLinks" variant="buttons" />
      </section>

      <section class="footer__links">
        <h3>Our Services</h3>
        @for (link of footerLinks; track link.label) {
          <a [routerLink]="link.path" [fragment]="link.fragment">
            <fa-icon [icon]="angleIcon" aria-hidden="true" />
            <span>{{ link.label }}</span>
          </a>
        }
      </section>

      <section class="footer__contact">
        <h3>Contact Us</h3>
        <p>
          <fa-icon [icon]="locationIcon" aria-hidden="true" />
          <span>{{ contact.address }}</span>
        </p>
        <p>
          <fa-icon [icon]="phoneIcon" aria-hidden="true" />
          <span>{{ contact.phone }}</span>
        </p>
        <p>
          <fa-icon [icon]="emailIcon" aria-hidden="true" />
          <span>{{ contact.email }}</span>
        </p>
      </section>
    </div>
  </div>

  <div class="footer__bottom">
    <div class="container">
      Copyright &copy; <a routerLink="/">richwingtours.com</a>. All Rights Reserved.
    </div>
  </div>
</footer>
