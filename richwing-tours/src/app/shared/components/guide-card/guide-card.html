<article class="card">
  <img [src]="member.image.src" [alt]="member.image.alt" />
  <div class="card__body">
    <h3>{{ member.name }}</h3>
    <p>{{ member.designation }}</p>
    @if (member.socialLinks?.length) {
      <app-social-links [links]="member.socialLinks!" variant="buttons" />
    }
  </div>
</article>
