<div
  class="social-links"
  [class.social-links--icons]="variant === 'icons'"
  [class.social-links--buttons]="variant === 'buttons'"
>
  @for (link of links; track link.platform) {
    <a
      [href]="link.url"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="link.title || link.label"
      [attr.title]="link.title || link.label"
    >
      <fa-icon [icon]="link.icon" aria-hidden="true" />
      <span>{{ link.label }}</span>
    </a>
  }
</div>
