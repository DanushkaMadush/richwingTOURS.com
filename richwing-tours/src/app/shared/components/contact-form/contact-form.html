<form class="contact-form content-stack" [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Name
    <input type="text" formControlName="name" autocomplete="name" placeholder="Your name" />
    @if (hasError('name')) {
      <span>Name is required.</span>
    }
  </label>

  <label>
    Email
    <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    @if (hasError('email')) {
      <span>Enter a valid email address.</span>
    }
  </label>

  <label>
    Subject
    <input type="text" formControlName="subject" placeholder="Trip planning, booking, or question" />
    @if (hasError('subject')) {
      <span>Subject is required.</span>
    }
  </label>

  <label>
    Message
    <textarea rows="5" formControlName="message" placeholder="Tell us what kind of Sri Lanka trip you are planning"></textarea>
    @if (hasError('message')) {
      <span>Message is required.</span>
    }
  </label>

  <button type="submit" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Preparing...' : 'Send Message' }}
  </button>

  @if (submitMessage) {
    <p class="contact-form__status">{{ submitMessage }}</p>
  }
</form>
